---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".release-please-manifest.json"
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=siderolabs/talos
  TALOS_VERSION: v1.13.7

jobs:
  bundle-freshness:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Bundle Freshness
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          experimental: true
          install_args: --locked

      # GitHub executes dist/, not src/. A src change that was not rebuilt ships
      # nothing, and the action would silently keep running the previous version.
      - name: Check the committed bundle is current
        run: mise run build-check

      - name: Upload rebuilt bundle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  e2e:
    if: >-
      ${{ github.event_name != 'push'
      && !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: E2E (${{ matrix.name || matrix.example }})
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental || false }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Smallest thing that can boot: no schematic, no patches, all talosctl
          # defaults. Proves the happy path with an almost empty spec. Also the
          # boot-asset cache leg: the first run per Talos version saves, every
          # later run restores instead of downloading from the Image Factory.
          - example: minimal
            nodes: 1
            cache: true
          # Exercises the parts a spec actually uses in anger: a registered
          # schematic carrying its own kernel arg, per-role sizing, extra worker
          # disks, and patches that override a profile default.
          - example: full
            nodes: 3
            # The spec's own schematic content must survive into the booted nodes.
            # Asserting only that a schematic id exists is not enough: the profile
            # synthesizes one from its kernel args, so a discarded user schematic
            # still yields a non-empty id.
            expect-kernel-arg: console=ttyS0
          # The docker provider: a different subcommand, --subnet instead of --cidr,
          # no --controlplanes, no sudo, and a profile with the schematic-bound parts
          # dropped. Needs no KVM, so it is also the fast leg.
          - example: docker
            nodes: 2
          # The maintenance preset: nodes boot and stay unconfigured, so no cluster
          # forms, kubectl never applies, and the hand-off is the node addresses plus
          # an empty kubeconfig output. Verified over the insecure maintenance API.
          - example: maintenance
            nodes: 1
            maintenance: true
          # The next Talos release, before consumers can hit it. `cluster create
          # dev` promises no flag stability between releases, so this leg pays that
          # tax up front: the dev dialect and the next config contract are proven
          # here weeks before the release ships. minimal.yaml pins no talos-version,
          # so the action's talosctl-version fallback drives every Factory URL to
          # this version too. A prerelease pin lets Renovate offer prereleases; once
          # it converges on a final release, re-point it at the next alpha by hand.
          - example: minimal
            name: talosctl-next
            nodes: 1
            # renovate: datasource=github-releases depName=siderolabs/talos
            talos-version: v1.14.0-beta.1
            cache: true
            # Non-blocking until #46 (profile patches vs 1.14 typed config
            # documents) is fixed; the drift stays visible without gating merges
            # on an upstream beta.
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Deliberately a plain binary on PATH rather than a version manager: the
      # action must not depend on how talosctl got there.
      - name: Install talosctl
        env:
          TALOS_VERSION: ${{ matrix.talos-version || env.TALOS_VERSION }}
        run: |
          curl -sfL "https://github.com/siderolabs/talos/releases/download/${TALOS_VERSION}/talosctl-linux-amd64" -o talosctl
          sudo install -m 0755 talosctl /usr/local/bin/talosctl
          talosctl version --client

      # Host prep is the workflow's job, not the action's. Doing it here also proves
      # the documented setup in the README is the setup that actually works.
      - name: Install QEMU
        if: matrix.example != 'docker'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf

      - name: Enable swap
        if: matrix.example != 'docker'
        run: |
          sudo fallocate -l 8G /mnt/e2e-swapfile
          sudo chmod 600 /mnt/e2e-swapfile
          sudo mkswap /mnt/e2e-swapfile
          sudo swapon /mnt/e2e-swapfile

      # The docker provider's nodes are containers on the runner's kernel, so flannel
      # runs against host modules it cannot load itself. Without br_netfilter the
      # sysctl it probes (bridge-nf-call-iptables) is absent, flannel exits before
      # writing /run/flannel/subnet.env, the CNI plugin then fails every pod sandbox,
      # and cluster create waits out its full timeout on coredns never going ready.
      # The qemu nodes boot a real kernel and load it themselves, so this is docker-only.
      - name: Load br_netfilter for the container network
        if: matrix.example == 'docker'
        run: sudo modprobe br_netfilter

      - name: Create cluster
        id: cluster
        uses: ./
        with:
          config: examples/${{ matrix.example }}.yaml
          cache: ${{ matrix.cache || false }}

      - name: Verify the cluster came up
        if: ${{ !matrix.maintenance }}
        env:
          EXPECTED_NODES: ${{ matrix.nodes }}
          ENDPOINT: ${{ steps.cluster.outputs.endpoint }}
        run: |
          kubectl wait --for=condition=Ready node --all --timeout=5m
          actual=$(kubectl get nodes --no-headers | wc -l)
          if [[ "$actual" -ne "$EXPECTED_NODES" ]]; then
            echo "::error::expected $EXPECTED_NODES nodes, found $actual"
            kubectl get nodes -o wide
            exit 1
          fi
          # The action reports where it thinks the first control plane is; if that
          # drifts from what the provisioner did, every downstream step misfires.
          talosctl -n "$ENDPOINT" version --short

      # Nodes in maintenance mode never form a cluster, so the check is the inverse
      # of the kubectl one: the insecure maintenance API answers, the kubeconfig
      # output is empty, and neither KUBECONFIG nor TALOSCONFIG was exported into
      # this step's environment.
      - name: Verify the nodes are in maintenance mode
        if: matrix.maintenance
        env:
          CONTROLPLANE_IPS: ${{ steps.cluster.outputs.controlplane-ips }}
          KUBECONFIG_OUT: ${{ steps.cluster.outputs.kubeconfig }}
        run: |
          if [[ -n "$KUBECONFIG_OUT" ]]; then
            echo "::error::kubeconfig output should be empty in maintenance mode, got $KUBECONFIG_OUT"
            exit 1
          fi
          if [[ -n "${KUBECONFIG:-}${TALOSCONFIG:-}" ]]; then
            echo "::error::KUBECONFIG/TALOSCONFIG must not be exported in maintenance mode"
            exit 1
          fi

          node="${CONTROLPLANE_IPS%%,*}"
          # The action waits for the maintenance API before returning, so a single
          # immediate call must succeed; a retry loop here would hide a regression.
          talosctl -n "$node" get links --insecure

      - name: Verify the reported outputs
        env:
          EXAMPLE: ${{ matrix.example }}
          MAINTENANCE: ${{ matrix.maintenance }}
          PROVIDER: ${{ steps.cluster.outputs.provider }}
          KUBECONFIG_OUT: ${{ steps.cluster.outputs.kubeconfig }}
          TALOSCONFIG_OUT: ${{ steps.cluster.outputs.talosconfig }}
          SCHEMATIC_ID: ${{ steps.cluster.outputs.schematic-id }}
        run: |
          # In maintenance mode no kubeconfig exists; its emptiness is asserted in the
          # step above. The talosconfig is still written next to the generated machine
          # configs in both modes.
          if [[ "$MAINTENANCE" != "true" ]]; then
            test -s "$KUBECONFIG_OUT" || { echo "::error::kubeconfig output is empty"; exit 1; }
          fi
          test -s "$TALOSCONFIG_OUT" || { echo "::error::talosconfig output is empty"; exit 1; }

          expected=qemu
          [[ "$EXAMPLE" == docker ]] && expected=docker
          if [[ "$PROVIDER" != "$expected" ]]; then
            echo "::error::expected provider $expected, got $PROVIDER"
            exit 1
          fi

          # Only the qemu provider registers a schematic; docker boots a prebuilt
          # image and must report none.
          if [[ "$expected" == docker && -n "$SCHEMATIC_ID" ]]; then
            echo "::error::docker reported a schematic id: $SCHEMATIC_ID"
            exit 1
          fi
          echo "provider=$PROVIDER schematic-id=${SCHEMATIC_ID:-<none>}"

      # Reads back the schematic the nodes actually booted from. A spec's own
      # customization reaching the Factory is not observable from the outputs alone.
      - name: Verify the spec's schematic survived
        if: matrix.expect-kernel-arg != ''
        env:
          SCHEMATIC_ID: ${{ steps.cluster.outputs.schematic-id }}
          EXPECT: ${{ matrix.expect-kernel-arg }}
        run: |
          if [[ -z "$SCHEMATIC_ID" ]]; then
            echo "::error::no schematic id was reported"
            exit 1
          fi
          curl -sfL "https://factory.talos.dev/schematics/${SCHEMATIC_ID}" -o schematic.yaml
          if ! grep -q -- "$EXPECT" schematic.yaml; then
            echo "::error::the spec's schematic was discarded: '$EXPECT' is absent from $SCHEMATIC_ID"
            cat schematic.yaml
            exit 1
          fi
          echo "spec schematic preserved: $EXPECT"

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get nodes,pods -A -o wide || true
          kubectl get events -A --field-selector type=Warning --sort-by=.lastTimestamp || true

  lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          experimental: true
          install_args: --locked

      - name: Lint workflows and shell
        run: mise run lint

      - name: Check formatting
        run: |
          mise run fmt
          git diff --exit-code

  unit-test:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Unit Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          experimental: true
          install_args: --locked

      - name: Run tests
        run: mise run test

  workflow-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Workflow Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false

      - name: Resolve linter versions
        id: tools
        run: |
          echo "actionlint=$(mise config get tools.actionlint)" >> "$GITHUB_OUTPUT"
          echo "zizmor=$(mise config get tools.zizmor)" >> "$GITHUB_OUTPUT"

      - name: Lint workflows
        uses: home-operations/.github/actions/workflow-lint@dfa0b198336d33dcbe73557a68315d3071ec7709 # workflow-lint-1.0.0
        with:
          actionlint-version: ${{ steps.tools.outputs.actionlint }}
          zizmor-version: ${{ steps.tools.outputs.zizmor }}

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - bundle-freshness
      - e2e
      - lint
      - unit-test
      - workflow-lint
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      # cancelled counts as failed: !cancelled() above still runs this job when
      # individual needs were cancelled but the run was not, and a required job
      # that never reached a verdict must not clear the merge gate.
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: |
          echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
